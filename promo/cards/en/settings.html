<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../card.css">
<style>
  .win { position:absolute; border-radius:12px; overflow:hidden; background:#18181b; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); }
  .bar { height:34px; display:flex; align-items:center; gap:10px; padding-left:14px; font-size:13px; color:#cfcfd8; }

  .bar .c { margin-left:auto; display:flex; } .bar .c span { width:44px; text-align:center; color:#9a9aa8; font-size:13px; }

<body>
  <div class="brand"><img src="../../../Assets/kadr.png">Kadr</div>
  <div style="position:absolute; left:72px; top:190px; width:600px">
    <h1>Your own <em>hotkeys</em> and a one-click install</h1>
    <p class="sub">Click a shortcut and press a new one, be it PrtSc or Ctrl+Shift+4. No admin rights needed, starts with Windows, uninstalls from Apps &amp; features.</p>
  </div>
  <div class="win" style="left:760px; top:70px; width:600px; height:700px">
    <div class="bar"><img src="../../../Assets/kadr.png">Kadr — Settings<div class="c"><span>—</span><span>☐</span><span>✕</span></div></div>
    <img src="../../scenes/en/settings.png" style="width:600px; display:block">
  </div>
  <div class="win" style="left:1100px; top:430px; width:420px">
    <div class="bar"><img src="../../../Assets/kadr.png">Installing Kadr<div class="c"><span>✕</span></div></div>
    <img src="../../scenes/en/install.png" style="width:420px; display:block">
  </div>
