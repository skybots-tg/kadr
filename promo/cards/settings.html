<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
  .win { position:absolute; border-radius:12px; overflow:hidden; background:#18181b; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); }
  .bar { height:34px; display:flex; align-items:center; gap:10px; padding-left:14px; font-size:13px; color:#cfcfd8; }
  .bar img { width:16px; height:16px; }
  .bar .c { margin-left:auto; display:flex; } .bar .c span { width:44px; text-align:center; color:#9a9aa8; font-size:13px; }
</style></head>
<body>
  <div class="brand"><img src="../../Assets/kadr.png">Кадр</div>
  <div style="position:absolute; left:72px; top:190px; width:600px">
    <h1>Свои <em>горячие клавиши</em> и установка в один клик</h1>
    <p class="sub">Нажмите на сочетание и введите новое — хоть PrtSc, хоть Ctrl+Shift+4. Установка без прав администратора, автозапуск, удаление через «Приложения».</p>
  </div>
  <div class="win" style="left:760px; top:70px; width:600px; height:700px">
    <div class="bar"><img src="../../Assets/kadr.png">Кадр — настройки<div class="c"><span>—</span><span>☐</span><span>✕</span></div></div>
    <img src="../scenes/settings.png" style="width:600px; display:block">
  </div>
  <div class="win" style="left:1100px; top:430px; width:420px">
    <div class="bar"><img src="../../Assets/kadr.png">Установка Кадра<div class="c"><span>✕</span></div></div>
    <img src="../scenes/install.png" style="width:420px; display:block">
  </div>
</body></html>
