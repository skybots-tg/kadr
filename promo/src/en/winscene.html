<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 2048px; height: 1152px; overflow: hidden; position: relative;
    background:
      radial-gradient(1200px 800px at 18% 20%, #6d5dfc 0%, transparent 60%),
      radial-gradient(1000px 900px at 85% 80%, #c04bff 0%, transparent 60%),
      radial-gradient(900px 700px at 70% 10%, #2f7bff 0%, transparent 65%),
      linear-gradient(135deg, #16123a, #2a0f47); }
  .win { position: absolute; left: 384px; top: 176px; width: 1280px; height: 800px; border-radius: 8px; overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08); }
  .win img { display: block; width: 1280px; height: 800px; }
</style>
</head>
<body>
  <div class="win"><img src="../../assets/en/app.png"></div>
</body>
</html>
